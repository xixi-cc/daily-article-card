name: 部署到 GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 安装 Playwright 依赖
        run: |
          npm install
          npx playwright install --with-deps chromium
          
      - name: 抓取论文首图
        run: |
          python scripts/enrich_daily_cards.py
          python scripts/check_card_standard_sync.py
          python scripts/validate_paper_cards.py
          python scripts/fetch_paper_images.py

      - name: 生成首图截图兜底队列
        run: |
          python scripts/build_paper_image_fallback_queue.py

      - name: Playwright 截图兜底
        run: |
          npm run paper-image:fallbacks

      - name: 注册截图兜底首图
        run: |
          python scripts/register_paper_image_fallbacks.py

      - name: 注册 PDF 首页最终兜底
        run: |
          python scripts/register_pdf_page_fallbacks.py
          
      - name: 构建网站
        run: |
          python scripts/build_site.py
          python scripts/validate_paper_cards.py

      - name: 提交更改
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add papers.md
          git add -f site
          if git diff --staged --quiet; then
            echo "没有更改需要提交"
          else
            CURRENT_DATE=$(date '+%Y-%m-%d')
            git commit -m "自动更新：爬取新论文并构建网站 - $CURRENT_DATE [skip ci]"
            git push
          fi
          
      - name: 设置 Pages
        uses: actions/configure-pages@v5
        
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
