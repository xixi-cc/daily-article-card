    <title>VIScore: Diagnosing Planning-Relevant Quality in Latent World Models - 封面卡</title>
    <meta name="description" content="将潜在空间调节为各向同性高斯分布，为世界模型规划提供了稳定且信息最大化的景观。然而，潜在的空间属性和成功的规划仍然脱节。我们首先通过比较 SIGReg 和 VISReg 这两个具有相同分布目标但不同属性的正则化损失函数来研究这一点。与SIGReg相比，VISReg在控制中心、尺度和形状正则化的权重方面具有更大的灵活性，并且更大的batch size带来更精细的分布近似。我们发现，前者尽管有利于自监督学习（SSL），但无助于规划，而后者提高了域外（OOD）数据集上的规划成功率。这促使我们深入了解与成功率相关的因素。与之前仅关注编码潜在的指标不同，我们提出了准确性-影响-清醒分数（VIScore），该指标量化给定编码特征的预测器的可达性和容量，以及基于搜索的规划器的幻觉。与直线度、物理状态探测和赋权相比，我们发现，通过涵盖编码器、预测器和规划器的测量，VIScore 比其他方法更好地解释了成功率，这反映在强烈的 Spearman 相关性上。具体来说，VIScore 在跨任务成功率池的已见和未见模型和数据集上始终实现超过 0.75 的 Spearman 相关性。此外，VIScore 是唯一一个校准误差低于所有测试场景的恒定拟合的指标，展示了这三个方面对于规划成功的重要性。我们希望这个指标能够帮助未来的世界模型设计和诊断研究。" />
