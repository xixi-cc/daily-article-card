    <title>A Mean-Field Framework for Inference-Time Distributional Control of Diffusion Models - 封面卡</title>
    <meta name="description" content="扩散模型越来越多地用作可控采样器，可以根据所选的奖励函数在推理时间引导其生成。虽然此类奖励通常是在单个样本上定义的，但对于许多应用程序来说，需要根据分布级别的奖励进行引导，例如使用群体级别的信息进行校准或鼓励多样性。在这两种情况下，简单地将奖励梯度纳入动态虽然通常有效，但对采样分布的理论保证很少。因此，对于逐点奖励，最近的工作试图开发一个原则框架，用于使用粒子重新加权来瞄准规定的倾斜分布。然而，目前缺乏类似的基于理论的分配奖励方法。在这项工作中，我们将推理时间分布控制制定为在平均场框架下针对倾斜测量，并推导出加权相互作用粒子方案以有原则的方式针对它。我们的框架将逐点奖励转向作为一种特例，同时为现有的批量级转向方法提供理论基础。根据经验，我们验证该程序正确地针对易处理的低维设置中的规定分布，并研究其在高维蛋白质构象任务中的行为。" />
