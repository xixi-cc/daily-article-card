    <title>Transformers Struggle to Use Their Emergent World Models - 封面卡</title>
    <meta name="description" content="河内塔是一个简单的规划难题，在之前的工作中已证明对大型推理模型 (LRM) 具有挑战性。当前的模型解决了难题的标准公式，但仍然难以解决平坦到平坦的变体（其中初始状态和目标状态不限于将所有环放在一个钉子上）。本文深入研究了小型内部 Transformer 和大型第三方 LRM 如何解决此任务。为了从机制上理解故障，我们首先在预先计算的解决方案轨迹上从头开始训练小型 Transformer。使用各种可解释性技术，我们证明这些Transformer开发了一种新兴世界模型：谜题状态空间（谢尔宾斯基三角形）的线性可解码、几何忠实表示，它因果地参与解决谜题。其次，我们回到大型法学硕士，并将我们的技术应用于两个前沿推理模型：Qwen3.6-27B 和 DeepSeek-R1-Distill-Qwen-32B，它们试图通过扩展的思维链来解决任务。令人惊讶的是，我们发现这两个模型在提示结束时几乎完美地编码了 Sierpinski 世界模型，但当环数超过 3 个时，大多数任务都会失败。我们将这种失败的根源归咎于世界模型的衰退。我们在规划过程中的不同阶段探索表示，并通过表明可以通过在推理时注入即时表示来提高性能来建立因果关系。因此，模型的失败是所需表示的维护之一，而不是它们的缺失，并且性能至少可以部分恢复。因此，这些结果重新构建了先前工作中报告的性能崩溃：当前的大型推理模型构建了一个世界模型，然后又丢失了它。" />
