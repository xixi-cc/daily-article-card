    <title>From Objectives to What Models Learn: A Landau Theory of Invariant Learning - 封面卡</title>
    <meta name="description" content="不变学习寻求在不同环境中保持预测性的表示，但其目标沿着正则化路径的行为通常是不透明的。我们通过将表示学习视为多模磁化并从具体的不变学习目标中推导出朗道型有效自由能来解决这一目标行为差距，其低阶系数形成客观特征并诱导不同的正则化表型。有效的二次校正可移动相边界并实现有限强度模式消除；四次校正调节起始后振幅，通常将残余载荷保持在有限强度；高阶结构控制着大正则化时的非单调尾部、不稳定性和崩溃。在规范双线性模型中，该理论产生封闭形式的相边界和稳态载荷，以及定义选择性保留窗口的捷径和稳定模式的不同临界强度。对照实验证实了预测的相边界、负载和正则化表型。在一层和两层隐藏层 ReLU 网络中，尽管存在深度依赖的尺度变化，相同的特征仍然可以预测定性正则化路径行为。矩阵扩展将框架推广到耦合集体模式并产生谱相边界准则。总之，该框架将低阶客观特征转化为正则化表型的预测，并最终将模型随着正则化的变化而学习的内容进行预测。" />
