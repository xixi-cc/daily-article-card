    <title>On the Capability Separation Between World-Model Policy Learning and Imitated World-Action Models - 封面卡</title>
    <meta name="description" content="世界–动作模型先预测未来结果，再推断与该结果相关的动作。虽然这种分解可改善表示学习与数据效率，但当它与直接行为克隆只使用同一批观测示范时，是否具有更强控制能力并不清楚。本文比较直接行为克隆策略、模仿训练的世界–动作策略，以及用动作条件世界模型优化的策略。控制器类层面，任意世界–动作策略都可压平成直接随机策略，并保持完全相同的闭环轨迹分布。人口极限层面，在可实现、精确优化、部署信息相同且部署保持分布等条件下，直接行为克隆与世界–动作模仿都恢复观测行为策略。因此，预测未来改变了学习分解，却不改变无约束外部策略类或理想模仿目标。动作条件世界模型不同之处在于：它预测指定动作的后果，并通过控制目标比较这些后果。论文刻画了不输入候选动作的未来模型不可约的动作特异预测误差，给出世界–动作联合分布恢复干预前向模型的条件，并证明一般情况下观测示范不能识别动作效应。最后，作者构造一族环境：任意观测学习器都有正的最坏情形 regret，而一次有信息的干预即可实现零 regret。关键分界不是控制器是否预测未来，而是它预测的是观测行为相关的未来，还是用于策略优化的指定动作后果。" />
