    <meta name="description" content="RFNN 小噪声、有限 \(m&gt;1\) 时，总体损失先降再升，插值后第二次下降停在较高平台。偏差约从特征宽度 \(p\sim n\) 开始增长，方差主导的插值峰约在 \(p\sim nm\)；可训练参数实际分别是这些宽度乘以 \(d\)。两个尺度在方法上对应独立干净样本信息与有限训练约束数量，不能混作一个阈值。解析曲线和有限维模拟互相支持，经验测试损失却持续接近经验 score（原 PDF 物理 pp.5–8，Figures2–5；pp.42–43，Figure15）。" />
