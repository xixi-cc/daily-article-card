    <meta name="description" content="Edge of stability (EoS) 指深度学习中 Hessian eigenvalue 长期稳定在经典 descent lemma 预测的不稳定阈值之上。既有理论使用最大 Hessian eigenvalue 与 learning rate；本文观察到 GD、Adam 等多种一阶方法可系统性违反其预测，最大达到 21.1 倍，且偏移强烈依赖 optimizer。作者改为沿优化器实际执行的 update，使用 directional/secant Hessian 与 gradient-alignment score 推导 realized edge of stability。新量消除 optimizer-dependent offset，使阈值预测更一致，并把优化器作用分解为 temporal 与 spatial budget 的主动平衡。" />
