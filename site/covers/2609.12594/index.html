    <title>Poisson-Corrector Complexity Bounds for Moreau--Yosida Unadjusted Langevin Sampling - 封面卡</title>
    <meta name="description" content="首先把一次准确扩散的积分漂移偏差\(D_k\)分解成corrector首尾差与条件均值零的\(M_{k+1}\)。\(X_t\)为以\(\pi_\lambda\)起始的准确扩散，\(\mathcal F_{kh}\)为Brownian滤过；估计由弱Hessian的平均迹与半群反向局部Poincaré控制，非光滑增量平方为\(O(\sqrt t)\)： \[\begin{aligned}D_k&amp;=\chi_h(X_{kh})\\&amp;\quad-\chi_h(X_{(k+1)h})\\&amp;\quad+M_{k+1},\\\mathbb E[M_{k+1}\mid\mathcal F_{kh}]&amp;=0,\\\mathbb E|M_{k+1}|^2&amp;\le C L_f^2(dh^3+R^2h^4)\\&amp;\quad+CG^2R h^{5/2}.\end{aligned}\] 于是变换误差为\(Y_k=X_{kh}-\widehat X_k+\chi_h(X_{kh})\)，局部确定性偏差变成可望远镜相消的状态修正。矩阵收缩后，鞅方差中的\(h^{5/2}\)除以混合尺度\(mh\)并开方，给出最终\(h^{3/4}\)阶；还需控制corrector与曲率的相关反馈，不能在这里省略。（物理9–10、15–16页） 第二个承重机制用同一\(B_h\)耦合准确扩散与Euler一步。\(A_\lambda^g\)是非光滑梯度两点差的正半定秩至多一矩阵；对任意确定性起点\(x,y\)有： \[\begin{aligned}X_h^x,\widehat X_1^y&amp;\text{ use the same }B_h,\\\mathbb E\operatorname{tr}A_\lambda^g(X_h^x,\widehat X_1^y)&amp;\le CG\sqrt{d/h}.\end{aligned}\] 证明先条件于与高斯端点独立的Brownian bridge，再对端点求Jacobian；\(hL_\lambda\)充分小时，插值端点Jacobian的对称部分一致为正。对高斯端点积分分部，把弱Hessian迹转成有界的\(\nabla g_\lambda\)，得到平均曲率界。平滑逼近、cocoercive闭锥上的下半连续性与Fatou使论证适用于\(C^{1,1}\)包络；没有假设时间Hessian可交换或Jacobian本身对称。（物理17–19页） 第三步必须面对相关性：\(\chi_h(X_{kh})\)和两点曲率矩阵并不独立。作者联合平均迹界、确定性上界\(\lambda^{-1}\)及全阶矩，用随比值对数增长的Hölder指数获得： \[\begin{aligned}\mathbb E\,[\chi_h^\top A_\lambda^g\chi_h]&amp;\le CK^2G\sqrt d\,h^{3/2}\ell_{h,\lambda}^4.\end{aligned}\] 因此曲率反馈只产生对数损失。\(R,K\)仍含模型与维数成本；它不是无维度或无条件数的结论。（物理19–20页） Theorem5.1证明MYULA在\(\mathcal P_2\)中存在唯一不变分布\(\widehat\pi_{\lambda,h}\)，下式\(A_0,B_{h,\lambda}\)仅将源式两组完整系数分行重命名，\(c,C&gt;0\)为普适常数： \[\begin{aligned}0&lt;hL_\lambda&amp;\le c,\\\sqrt m\,W_2(\pi_\lambda,\widehat\pi_{\lambda,h})&amp;\\&amp;\le C A_0h\\&amp;\quad+C B_{h,\lambda}h^{3/4},\\A_0&amp;=R(\sqrt m+\sqrt{L_f})\\&amp;\quad+L_f\sqrt d,\\B_{h,\lambda}&amp;=G\sqrt R\\&amp;\quad+K\sqrt G\,d^{1/4}\ell_{h,\lambda}^2.\end{aligned}\] 误差系数不含逆平滑参数的多项式，但条件\(h(L_f+\lambda^{-1})\le c\)完整保留。证明准确过程平稳即可，不需要预先假定Euler已经平稳：共享噪声界可条件于任意历史起点，最后用\(W_2\)收缩和\(\mathcal P_2\)完备性得Euler不变律。（物理9–10页） 最后对\(0&lt;\varepsilon\le1\)，Moreau偏差由前作Proposition5.9给出；令\(B_\varepsilon\)保留相同系数但使用精度对数，三个步长约束分别控制稳定性、线性离散项与非光滑项： \[\begin{aligned}\sqrt m\,W_2(\pi_\lambda,\pi)&amp;\le G^2\lambda/4,\\\lambda_\varepsilon&amp;=\varepsilon/G^2,\\\ell_\varepsilon&amp;=1+\log(e+\varepsilon^{-1}),\\B_\varepsilon&amp;=G\sqrt R\\&amp;\quad+K\sqrt G\,d^{1/4}\ell_\varepsilon^2,\\h_\varepsilon&amp;=c\min\left\{\frac1{L_f+G^2/\varepsilon},\right.\\&amp;\qquad\left.\frac\varepsilon{A_0},\left(\frac\varepsilon{B_\varepsilon}\right)^{4/3}\right\}.\end{aligned}\] 对任意有限二阶矩初始分布\(\mu_0\)，\(\mu_N\)为选定参数的第\(N\)步分布，\(D_0\)是初始误差除以目标精度的比值。Theorem5.2将平滑偏差、Euler稳态偏差与有限时混合分配进同一误差预算： \[\begin{aligned}D_0&amp;=\frac{\sqrt m W_2(\mu_0,\pi)}\varepsilon,\\N&amp;\ge\frac C{mh_\varepsilon}\log(2+D_0)\\&amp;\Longrightarrow\sqrt m W_2(\mu_N,\pi)\le\varepsilon,\\N(\varepsilon)&amp;=\widetilde O(\varepsilon^{-4/3})\quad\text{(fixed model)}.\end{aligned}\] \(\widetilde O\)仅在\(m,L_f,\tau_f,G,d,\mu_0\)固定而\(\varepsilon\downarrow0\)时隐藏对数。源式(5.9)仍保留\(m^{-1}\)、\(G^2/\varepsilon\)、\(L_f\sqrt d/\varepsilon\)以及\(K^{4/3}G^{2/3}d^{1/3}\ell_\varepsilon^{8/3}/\varepsilon^{4/3}\)等成本。没有给这个指数的最优性下界。（物理7、10–11页）" />
