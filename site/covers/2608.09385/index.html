    <title>Imaginative Generative AI: Crossing the Entropy Wall into Worlds Beyond Imitation - 封面卡</title>
    <meta name="description" content="生成式AI模型主要是为了模仿数据分布而设计的，这一目标既不能纠正学习生成器丢失的多样性，也不能定义生成应如何超越数据本身的多样性。我们引入了想象力生成AI（IGA），这是一个框架，它使多样性成为目标分布设计问题的一部分：在接近参考的分布中，IGA 选择一个光谱多样性达到规定水平的分布。多样性是通过固定表示空间中生成的分布的核协方差算子的冯诺依曼熵来测量的，提供了一种无参考表示引导的概率质量占据嵌入方向的度量。总体数据分布的谱熵定义了熵墙。在墙下方，IGA 执行多样性修复，恢复学习生成器丢失的变化，同时保持在数据的多样性水平内。越过墙，数据分布本身就变得不可行，IGA 故意偏离它，以产生具有更大的代表性相对光谱多样性的分布，这是想象力生成的操作概念。这些机制形成了从模仿到想象的单一正则化路径，并定义了独立同分布。每个规定的多样性水平的目标分布。我们发展了这种熵约束投影的理论，并表明，在预训练生成器的 KL 锚点下，最优值满足自洽指数倾斜关系。这种特征导致了 IGA Guidance，这是一种用于基于分数和扩散模型的免重新训练推理时间方法，包括 DDPM 和 DDIM 采样器。合成和视觉基准的实验证明了熵墙以下的多样性修复以及熵墙之外的受控光谱外推。" />
