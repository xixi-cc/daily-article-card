    <title>Crossing over universal scaling laws in two-dimensional driven dissipative condensates - 封面卡</title>
    <meta name="description" content="在低维系统中，涨落增强并防止连续对称性的自发破缺。结果，空间和时间相关函数在远距离和长时间内衰减。一个很好的例子是处于平衡状态的二维玻色子凝聚体，它不表现出相干性的长程有序，而是属于Berezinskii–Kosterlitz–Thouless普适性类的代数衰变。相比之下，非平衡玻色子凝聚体的普遍行为更加多样化，并且仍然存在许多悬而未决的问题。在这里，我们探索了半导体光学微腔中二维驱动耗散极化子凝聚体的时空相干特性。通过调整微观参数，我们观察到两个标度定律之间的交叉，我们将其归因于 Edwards-Wilkinson (EW) 和 Kardar-Parisi-Zhang (KPZ) 普遍性类别。我们证明了测量的一阶相关性在 EW 和 KPZ 通用标度函数上的崩溃，并获得了与理论预测值很好匹配的临界指数。我们的结果强调了极化子凝聚体的内在非平衡性质，并将其确立为二维 KPZ 普适性类受控探索的首选平台。" />
