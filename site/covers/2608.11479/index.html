    <title>Convergence Guarantees of Gradient Descent for Neural Networks via Generalized Lipschitz Smoothness - 封面卡</title>
    <meta name="description" content="我们为任意宽度或深度的通用前馈神经网络建立梯度下降的收敛保证，对初始化或数据集没有特殊要求。我们只假设激活函数是 Lipschitz 平滑、Lipschitz 连续和线性有界的——这些属性适用于线性、tanh、softplus 和 sigmoid 激活函数。对于损失函数，我们要求模型输出是 Lipschitz 平滑的，这对于均方误差来说也是如此。关键的理论见解是，即使通过重复组合，激活函数的 Lipschitz 属性也会部分保留，从而产生一种新颖的广义 Lipschitz 平滑条件，其中梯度的变化以参数空间的变化为上限，乘以两个端点处参数范数的多项式项。这种类型的条件适用于模型函数和损失函数，从而实现下降引理，只要学习率相对于参数范数足够小，损失就会减少。通过确保参数范数不会增长得太快到无穷大，我们证明对于 $L$ 层神经网络，最小平方梯度范数在 $T$ 迭代中以 $O(1/T^{1/L})$ 速率收敛到零。" />
