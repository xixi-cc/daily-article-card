    <meta name="description" content="\[\begin{aligned}K&amp;=\sum_{i\le\lfloor N^q\rfloor}\lambda_i u_i v_i^\top,\\\|u_i\|&amp;=\|v_i\|=1,\quad q\in[0,C],\\N^{-q}\operatorname{tr}(K\Delta)&amp;\xrightarrow[N\to\infty]{\mathrm{a.s.}}0.\end{aligned}\] 权重满足 \(\limsup_{N\to\infty}\max_i|\lambda_i|&lt;\infty\) 几乎必然。定理要求O与A/B及整个测试向量集合独立；作者没有额外声明权重与O独立，因为证明用最大权重的有界性乘以所有测试的绝对值界。不能改写为对任意依赖O的测试向量统一成立。q&gt;1允许更多求和项，不表示矩阵存在超过N个独立方向（第4、9–11页）。" />

    <p class="note-cover-abstract">在谱有界且离零、旋转为独立 Haar 正交矩阵的条件下，随机矩阵和的逆具有确定性测试等价；经过两侧预条件的单向量偏差可与标准高斯向量耦合，方差由自由卷积的逆矩与 R 变换导数确定。证明用有限时间条件矩控制与随后取大的时间极限，不能推广为算符范数近似或一般深网噪声模型。</p>
