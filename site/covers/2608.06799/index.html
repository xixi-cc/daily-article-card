    <title>Is Forward Prediction Enough? Physical State Grounding for JEPA World Models - 封面卡</title>
    <meta name="description" content="学习结构化和与控制相关的潜在表示仍然是世界模型的一个关键挑战。最近基于 JEPA 的世界模型从观察序列中学习动作条件预测潜在动态。然而，它们的前向预测目标并没有明确强制从个体潜在变量或潜在对状态变化中可靠地识别以机器人为中心的物理状态，这可能会限制下游规划和策略性能。我们提出了 PSG-JEPA，一种物理接地的 JEPA 世界模型，它通过两个超越前向预测的互补接地目标来塑造其潜在空间：将个体潜伏接地在机器人本体感受状态，并将潜在对接地在多水平关节角度变化中。这两个目标仅在训练期间应用，推理架构和计算成本保持不变。为了全面评估 PSG-JEPA，我们在三个层面进行实验：（1）通过探测实现潜在可识别性，（2）针对冻结潜在的目标条件规划，以及（3）模拟和真实机器人上的策略学习。实验表明，我们的 PSG-JEPA 在所有三个级别上始终优于最先进的潜在世界模型基线。" />
