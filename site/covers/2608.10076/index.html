    <title>Generalized Master Stability of Heterogeneous Delay-Coupled Networks - 封面卡</title>
    <meta name="description" content="时间延迟在物理和生物网络系统中普遍存在，在集体行为的出现和稳定性中发挥着基础作用。然而，现有的延迟耦合系统同步分析的理论方法很大程度上局限于具有同质度分布的网络。在这里，我们将主稳定性函数框架扩展到一类广泛的度异构、加权和有向延迟耦合网络。分析表明，与同质网络相比，异构网络中的同步可以得到增强，包括众所周知的在无延迟系统中最佳的全对全网络。为了识别最佳的异构结构，我们开发了一种网络优化方法，该方法可以找到定向的边缘加权配置，从而最大限度地提高同步稳定性。我们的结果表明，在延迟耦合网络中，异质性和非互易性是同步的关键资源。" />
