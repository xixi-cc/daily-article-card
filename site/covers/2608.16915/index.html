    <title>Exact mean-covariance dynamics of the Weber field in the stochastic Lagrangian representation of the 3D Navier-Stokes equations - 封面卡</title>
    <meta name="description" content="Constantin–Iyer 公式把三维环面上不可压 Navier–Stokes 的光滑解写成 $u=\mathbb P\,\mathbb E[(\nabla A_t)^\top(u_0\circ A_t)]$，即随机 Weber 场的 Leray 投影期望。本文把该期望分解为均值乘积与中心协方差，并证明：协方差、逆形变梯度的二阶矩以及两点协方差都满足闭合的确定性 advection–diffusion 方程。由于所有 Lagrangian label 共享同一 Brownian path，二次协变差坍缩为 Laplacian，不产生矩层级。由此得到能量/产生率平衡、逐点与 Hölder 协方差界以及两点算子在分离变量上的精确退化。均值位移满足沿流的受迫热方程，其 $L^2$ 范数由初始能量无条件控制；但一族精确 Navier–Stokes shear flow 证明不存在一直均匀到 $t=0$ 的类似 Hölder 界。论文还用显式反例隔离多个障碍，并给出与速度 Serrin norm 等价的 gauge-invariant quotient criterion，以及对均值坐标为至少秩一仿射映射的 ancient solution 的 Liouville 型刚性定理。作者明确不声称解决全局正则性，缺失步骤被列为开放问题。" />
