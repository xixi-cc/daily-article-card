    <title>Generalised stochastic curvature flow in d≥2, and sharp interface limit for the stochastic Allen-Cahn equation with nonlinear diffusion - 封面卡</title>
    <meta name="description" content="我们构造了由时间白和空间平滑高斯噪声强制的维度 $d \geq 2$ 中广义各向异性方向相关曲率流的局部时间解。这似乎是第一个具有时间白噪声的结构，即使在各向同性随机平均曲率流的简单情况下，它也允许空间依赖性。主要困难在于描述流动的随机偏微分方程具有非线性地依赖于解及其梯度的乘性噪声。关键技术是 \cite{BKMZ20} 中开发的基于粗略特征的变换，该变换消除了粗略的乘法项。我们还说明了这种变换与先前已知的特殊情况的关系。作为该构造的应用，我们表明，在短时间间隔内，具有非线性扩散和相同噪声（在时间上稍微平滑）的随机 Allen-Cahn 方程的尖锐界面极限由上述方向相关的随机曲率流给出。" />
