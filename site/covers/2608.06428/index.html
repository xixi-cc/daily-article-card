    <title>Fixed and Adaptive Topological DeepONets: Functional Measurements on Hausdorff Locally Convex Spaces - 封面卡</title>
    <meta name="description" content="深度算子网络（DeepONets；arXiv：1910.03193）通常通过固定离散化上的点值对输入函数进行编码。基于 Ismailov 的拓扑 DeepONet 框架（arXiv:2603.11972），我们用从 Hausdorff 局部凸空间 $({V},\{p_α\}_{α\in A})$ 的连续对偶中提取的连续线性函数替换点样本，其拓扑是由点分离的半范数族而不是单一范数生成的，并开发了固定和自适应函数测量系统。测量与 Lee 和 Shin (arXiv:2309.01020) 的系数空间两步过程相结合，同时仅训练解码器和正则化稳定了自适应坐标。我们推导了离散误差分解，将测量误差、输出基础误差和神经逼近误差分开，并进行了巴伦率细化。该框架在反导算子、非规范局部凸输入空间、异构达西流、受控算子以及固定时间和时间演化纳维-斯托克斯涡度算子上进行评估。在异构达西问题中，函数模型在看不见的网格上保留几乎与分辨率无关的误差 5.5-5.6%，而在受控问题中，自适应测量将平均误差降低到 1.2% 以下。对于固定时间纳维-斯托克斯问题，自适应拓扑 DeepONet 是最准确的基于 DeepONet 的模型，使用 128 个功能坐标获得平均相对 $L^2$ 误差为 1.685% +/- 0.017%。同等大小的傅里叶神经算子（FNO；arXiv：2010.08895）可实现较低的误差 0.832% +/- 0.172%，但需要完整的 64x64 输入字段、两倍的训练时间和 10.7 倍的峰值 GPU 内存。该公式在连续对偶 $V&#x27;$ 中提供紧凑、可解释和离散化可移植的坐标，包括非规范输入空间。" />
