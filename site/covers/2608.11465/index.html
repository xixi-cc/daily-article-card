    <title>PAC-Bayes Beyond Parameter Space: Behavioral Equivalence, Z-Information, and Exact Complexity Decomposition - 封面卡</title>
    <meta name="description" content="PAC-贝叶斯理论通过控制所选假设表示的后验分布和先验分布之间的 Kullback-Leibler (KL) 散度来提供泛化保证。然而，预测风险仅取决于假设引发的预测行为，而不取决于实现该行为的特定内部实现。在过度参数化的系统中，许多不同的配置会导致相同的预测行为，但经典的 PAC-Bayes KL 散度并不能区分预测行为的不确定性与行为等效实现之间的变化。我们证明这种区别导致了经典 PAC-Bayes 复杂性的精确结构分解。我们通过可测量的行为图将行为等价形式化，并使用测量分解将配置空间上的概率测量分解为预测行为的分布和行为纤维的条件分布。这将经典 PAC-Bayes KL 散度精确分解为行为选择项和由纤维内预期条件 KL 给出的实现级项。我们将 Z 信息定义为这种实现水平贡献的负值：KL 散度与单独预测行为的不确定性复杂性之间的确切差距。我们进一步表明，行为选择项承认精确的变分特征：它是所有后验中的最小 KL 散度，从而在预测行为上产生相同的分布，这是通过规范纤维对称代表获得的。最后，我们证明了对称性、行为保持方向、纤维几何形状和纤维保持扰动下的不变性自然地产生于相同的行为图结构。总之，这些结果将预测行为确定为 PAC-Bayes 复杂性的自然对象。" />
