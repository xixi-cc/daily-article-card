    <title>Bridge Graphical Models: Coupling, Projection, and Current-Preserving Dynamics for Generative Modeling - 封面卡</title>
    <meta name="description" content="连续时间生成模型常由 endpoint-conditioned bridge 构造，但生成时需要的是只观察当前状态和时间、非预见的 Markov decoder。本文把这种 bridge-to-decoder compression 识别为 diffusion、flow matching、rectified flow、Schrödinger bridge 和 field-based model 共有的结构瓶颈，并定义 Markovization gap：给定 Markov 状态后 bridge velocity 的条件方差对时间积分。它等于用 sampler 可见信息预测 endpoint-conditioned motion 的 MMSE，是神经网络训练之前就存在的不可约损失。Bridge Graphical Model (BGM) 将 endpoint coupling、bridge law、Markovian projection 与 current-preserving dynamics representation 分成独立设计项；Poisson/electrostatic model 也被表示为 field-line bridge kernel。CIFAR-10、Fashion-MNIST、latent 和合成 pilot 中，训练前数分钟计算的 feature-space proxy gap 在固定架构、bridge、sampler 和 compute 下与训练 loss/FID 的排序方向一致。" />
