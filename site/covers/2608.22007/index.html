    <title>The Communication Map of a Transformer - 封面卡</title>
    <meta name="description" content="Transformer 组件通过向共享 residual stream 写入并从中读取来通信，而机制可解释性过去常逐条电路手工绘制这些连接。本文提出 communication map：仅由权重出发绘制语言模型中每个潜在通信通道，把已有 composition score 推广为统一 coupling coefficient，覆盖从完整 attention-head 电路到单 neuron 的 18 类连接。对所有候选通道的普查从 GPT-2 的 $6.3\times10^8$ 对扩展到 Pythia-6.9B 的 $1.3\times10^{11}$ 对；70–89% 的 head pairs 相对随机方向显著偏离，有些强耦合，有些主动避开。完整图谱在一张消费级 GPU 上耗时从 GPT-2 的 15 秒到 Pythia-6.9B 的 11 分钟。两个应用验证其用途：最强 head-to-head coupling 可盲恢复已知 induction circuits 并把它们组成社区，消融该社区会破坏 in-context copying；汇总所有 head 的 coupling 后还能找到不同于 activation PCA 与 outlier dimensions 的二维 residual-stream 子空间，删除它会在六个模型中消除 induction 能力。作者公开图谱、统计工具与干预套件。" />
