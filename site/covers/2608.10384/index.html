    <title>Generator-Guided Inverse Sampling for Lévy-Driven Generative Models - 封面卡</title>
    <meta name="description" content="本文从Markov生成器的角度研究了 Lévy 驱动生成模型的逆采样。与传统的扩散模型不同，Lévy 驱动的动力学涉及无限的跳跃活动，这使得它们的逆过程非局域并且难以单独使用分数信息来表征。我们通过分析正向和反向发电机来应对这一挑战。由此推导出，反向跳跃分量通常成为由非局域密度比控制的状态相关Markov跳跃过程。这一观察激发了结构化反向采样器，将动力学分解为扩散、小跳跃和大跳跃分量。基于这一特征，我们为一类具有对称 $α$ 稳定跳跃分量的各向同性线性 Lévy SDE 开发了一种计算上易于处理的采样器。对于跳跃部分，神经网络仅用于摊销大跳跃活动的速率，而跳跃幅度是根据分析得出的条件分布生成的，这提高了可解释性和可控性。在此设置下进一步引入高效的实现技术，以避免昂贵的高维集成和采样。该采样器还适用于近似观测引导采样，并应用于混合高斯和脉冲噪声下的 OFDM-SISO 信道估计。仿真显示了稳健的估计性能，并在复杂性和性能之间进行了有利的权衡。" />
