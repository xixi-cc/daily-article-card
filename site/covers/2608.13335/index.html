    <meta name="description" content="用梯度下降训练、损失函数光滑的神经网络仍可能以台阶方式学习：损失在长平台期保持不变，随后突然下降；与此同时，训练损失又会呈现光滑的幂律。两种行为都出现在微观结构差异很大的架构中，暗示存在少数相关集体变量。本文证明，一个对称性决定了这些变量：网络层由可交换单元求和构成，重新标记单元不改变网络；结合光滑性以及单元在原点梯度为零的条件，近零初始化权重附近的展开具有普适首项 $\mathrm{Tr}[WW^\top A(x)]$，全部架构细节被压缩进结构矩阵 $A(x)$。感知机、attention、mixture of experts 与 convolution 因而只是不同 $A$ 下的同一模型。训练动力学在序参量 $M=WW^\top$ 上闭合；当数据矩阵共享特征基时，动力学约化为各模依次开启的 Lotka–Volterra 方程。初始权重越小，开启时刻分隔越远，平台成为光滑流的奇异极限；大量不可分辨事件叠加时形成训练时间的幂律，其指数可由理论预测。作者在多种训练方法与架构上进行了数值验证。" />
