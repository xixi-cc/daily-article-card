    <meta name="description" content="动力学受限晶格气体 (KCLG) 是粒子数守恒的相互作用粒子系统，其跃迁率因动力学约束而退化。过去十年中，人们对非守恒对应物——动力学受限自旋模型——取得了重要进展：在一维和二维中，其普适类已有较好理解。然而，守恒系统更难分析，可用结果很少。本文描述一维情形的普适性，刻画三个普适类，判断给定模型是始终遍历、从不遍历，还是出现遍历性相变。" />
