    <meta name="description" content="第一层证据是Theorem2.5的确切范围。以下\(\kappa&gt;0\)充分小，\(\eta\)为初态空间正则度，\(M\)为确定性几乎处处统一界；\(\gamma\)是初始时权重。初态可随机但须满足同一界，并在离散—连续距离中依概率收敛： \[\begin{gathered}-\frac23+\frac53\kappa&lt;\eta&lt;0,\\ \gamma=(\eta+\tfrac12)\wedge0,\\\sup_\varepsilon\|\theta^\varepsilon(0)\|_{\mathcal C_\varepsilon^\eta}\\+\|\theta(0)\|_{\mathcal C^\eta}\le M \quad\text{a.s.},\\\|\theta^\varepsilon(0);\theta(0)\|_{\mathcal C_\varepsilon^\eta}\\\longrightarrow0\\\quad\text{in probability},\\\partial_t\theta_i=\Delta\theta_i+\xi_i,\quad i=1,2,3,\\\forall T&gt;0,\ \forall\delta&gt;0:\quad\\ \mathbb P\bigl(\tau_\varepsilon&gt;T,\quad\\ \|\theta^\varepsilon;\theta\|_{\mathcal C_{\gamma,\varepsilon}^{-1/2-\kappa,T}} \le\delta\bigr)\longrightarrow1.\end{gathered}\] 输出不是逐点相位，而是负正则度随机分布。每个固定\(T\)都成立；“任意固定时间”与无限时间一致控制、几乎必然极限不同。严格初态阈值也不能仅写成\(\eta&gt;-2/3\)而删除\(\kappa\)余量。（物理11–12、33页） 第二层是噪声立方的真正缩放。令\(\widetilde\Psi^\varepsilon\)为零初态随机热卷积，\(P_t^\varepsilon\)为离散热半群，\(\widehat v^\varepsilon\)为零初态非线性余项；帽号表示全局辅助过程。对曲率分量\(X^\varepsilon_{ab}\)，Wick恒等式是： \[\begin{aligned}\widehat\theta^\varepsilon&amp;=\widetilde\Psi^\varepsilon +P_t^\varepsilon\theta^\varepsilon(0)+\widehat v^\varepsilon,\\ X^\varepsilon_{ab}&amp;=(d_\varepsilon\widetilde\Psi^\varepsilon)_{ab},\\ (X^\varepsilon_{ab})^3&amp;=:(X^\varepsilon_{ab})^3:\\ &amp;\quad+3c_t^\varepsilon X^\varepsilon_{ab},\\ c_t^\varepsilon&amp;=\mathbb E[(X^\varepsilon_{ab}(t,x))^2] =O(\varepsilon^{-3})." />

    <p class="note-cover-title-zh">三维abelian Yang–Mills格点Langevin动力学的连续极限</p>
    <p class="note-cover-abstract">弱耦合三维U(1)格点场，经DeTurck规范与局部对数缩放，在定理初态条件下，于每个固定有限时间区间依概率趋向一形式随机热方程。统一局部C⁶条件下，Wilson、Manton、Villain等作用的高阶差异消失；不含无限时间或非abelian结论。</p>
