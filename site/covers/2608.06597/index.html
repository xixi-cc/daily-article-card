    <title>Cascading Through the Hierarchy: Regularizer-Induced Feature Detection as Phase Transitions in Deep Linear Neural Networks - 封面卡</title>
    <meta name="description" content="深度学习的科学理论，包括学习动力学和学习模型的统计特性，正在迅速引起人们的关注。这一发展的基石之一是可分析解决的玩具模型，允许对学习动态进行完全易于处理的分析。在这里，我们使用正则化强度作为可调外部参数（类似于统计物理学中的外部场）来分析研究这样的玩具模型。在以前的研究中，（i）通过分析预测学习转变的开始，（ii）从现象学/数值上确定调整正则化强度可以导致一系列相变。这些转变的数量与由模型复杂性决定的损失景观的几何形状相关。我们的研究建立了一个严格的框架来支持之前的数值观察，揭示了相变级联、可学习特征和基础几何结构之间的精确联系。我们提供这些相变的分析预测以及与学习特征相关的易于处理的顺序参数。在最小模型的层面上，我们将这种宏观视角（可以浓缩成有效的描述）与以 Hessian 谱为特征的损失景观几何形状的微观视角联系起来。因此，所提出的模型提供了一个平台来探索和加强植根于统计物理概念的深度学习科学理论所取得的进展。" />
