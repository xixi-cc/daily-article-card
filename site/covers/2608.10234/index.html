    <title>The Kuramoto Neural Operator: Learning to Solve PDEs via Coupled Oscillator Dynamics - 封面卡</title>
    <meta name="description" content="算子学习是计算科学快速发展的领域。它特别适合解决必须在不同的物理配置下重复求解偏微分方程 (PDE) 的问题。大多数现有架构都以固定的方式代表解决方案运营商。虽然这一假设与全局结构很好地吻合，但它不太适合物理空间中局部相互作用控制的现象。我们探索了另一种观点，其动机是观察到耦合振荡器系统的连续极限可以描述一类广泛的偏微分方程。基于这个想法，我们引入了 Kuramoto 神经算子（KNO），它代表了通过相互作用振荡器的潜在场的演化来解决的解决方案。在各种 PDE 基准集合中，KNO 实现了强大的预测性能，并且比竞争方法有所改进。我们的实验评估还包括广泛的消融研究，该研究量化了 KNO 中每个架构组件的贡献。此外，我们表明模型的预测误差与潜在振荡器的集体动态密切相关。它随着它们的同步程度而系统地变化，提供对底层机制的洞察。" />
