    <title>A general paracontrolled ansatz for singular SPDEs - 封面卡</title>
    <meta name="description" content="我们为 Gubinelli、Imkeller、Perkowski 提出的用于处理奇异 SPDE 的副控制方法提供了一个通用的 ansatz。提出的 ansatz 涵盖了一大类方程。它是通过对其系数和随机数据进行编码的装饰树来描述的。主要的新颖之处是副控制随机迭代积分的递归定义，其中涉及精心选择的组合词集。副线性化是通过将迭代副积提升到建模分布和来自正则结构的重建定理来执行的。当人们使用包含 BPHZ 重整化的准备图形式主义时，我们还提供了一个不动点参数和重整化方程。最后一个主要结果是通过采用谱间隙方法的 BPHZ 重整化来收敛重整随机数据。最终通过参数控制方法得到了抛物型奇异SPDE的通解理论。" />
