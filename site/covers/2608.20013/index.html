    <title>Exact Fluctuation-Response Relations for Underdamped Langevin Dynamics - 封面卡</title>
    <meta name="description" content="热力学不确定性关系把 current fluctuation 与 dissipation 联系起来，但在欠阻尼动力学中，传统 mean-current 关系可能失效。本文对任意时变驱动和一般 additive observable 推导精确有限时间 fluctuation-response equality；它给出 sharp response bound 和动态生成方差的 variational characterization。把 perturbation 选在 irreversible probability flow 方向后，得到任意有限 observation time 都可饱和的 friction-response TUR，进而得到总 entropy production 的精确变分原理。作者还证明，即使在 driven free diffusion 中，velocity-resolved current 的传统 uncertainty factor 也可随耗散指数衰减，而 friction-response factor 保持普适下界。核心结论是 response，而非 mean current 本身，直接连接 fluctuation 与 dissipation。" />
