    <title>Macroscopic fluctuation theory for the multi-time statistics of current in non-stationary diffusive systems - 封面卡</title>
    <meta name="description" content="电流涨落的统计一直是非平衡物理中的核心研究对象。现有工作大多聚焦单时统计，而对其多时推广的研究相对不足。本文扩展宏观涨落理论（Macroscopic Fluctuation Theory, MFT）的涨落流体动力学框架，用于研究无限直线上扩散系统在非平稳状态下的多时统计。对于最简单的非相互作用晶格气体和硬核 Brownian 点粒子，作者给出 MFT 的显式解，从而得到多时大偏差统计。对于一般系统，作者对 MFT 作微扰求解，得到双时关联的显式结果。这些结果表明：此前在平坦初态下观察到的电流涨落与 fractional Brownian motion 之间的联系，在阶跃初态下不再成立。作者还通过求解非相互作用气体和 symmetric simple exclusion process（SSEP）的相应微观动力学，对上述流体动力学结果进行了独立验证，并进一步用数值模拟加以确认。" />
