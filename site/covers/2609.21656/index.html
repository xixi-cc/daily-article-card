    <meta name="description" content="精确恢复。Theorem 4.3 的关键等式把对齐写成分量与转移算符的相关性；\(h_j\) 是表示第 \(j\) 个分量，内积在 \(L^2(p)\) 中。精确边缘约束固定总方差，谱不等式给出下界（物理 p7，Theorem 4.3；证明 p22–23）： \[\begin{aligned}\mathcal L_p(h)&amp;=2dc_p\\&amp;\quad-2\sum_{j=1}^{d}\langle h_j,T_t h_j\rangle_{L^2(p)}\\&amp;\ge 2dc_p(1-e^{-\lambda t}).\end{aligned}\] 恒等映射可达到这个下界。等号迫使每个表示分量都在第一特征空间中，因此 \(h(z)=Az\)；各向同性进一步给正交性，完整支撑给流形保持。所有最优解具有以下形式，而不是任意可逆线性变换： \[\begin{aligned}h^\star(z)&amp;=Qz,\quad Q\in O(d),\\ Q(\mathcal M)&amp;=\mathcal M.\end{aligned}\] 对球面，非线性保面积自同构仍然存在。例如单位球面的经度扭转 \((\theta,\varphi)\mapsto(\theta,\varphi+a\cos\theta)\) 保持面积，但非零 \(a\) 时并非固定正交变换。它含有更快的非线性球谐分量，在指定 Brownian 扩散与严格谱间隔下对齐损失严格高于坐标解。因此，本文排除的是这类映射成为全局最优解，绝非声称它们不能保持球面均匀分布。该例为本次独立解析核查，不是作者实验或独立训练复现。" />

    <h1 class="note-cover-title">Beyond Gaussian Worlds: Latent Geometry Matters for JEPAs</h1>
    <p class="note-cover-title-zh">超越高斯世界：潜在几何对 JEPA 至关重要</p>
    <p class="note-cover-abstract">正样本的动力学与潜在世界的几何共同决定 JEPA 的恢复能力。若指定扩散的完整第一非恒定特征空间由潜坐标张成，精确分布匹配下的最优表示只差世界的正交对称性；近似界仍依赖精确匹配与谱间隔。均匀球面是可恢复的非高斯实例，有限训练对照支持目标几何的重要性，但不认证人口定理条件。</p>
